<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DayZ Server Map</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Banner ─────────────────────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 1000;
    }

    header h1 {
      color: #e94560;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #layer-toggle {
      margin-left: auto;
      background: none;
      border: 1px solid #2a2a4a;
      color: #aaa;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      flex-shrink: 0;
    }

    #layer-toggle:hover {
      border-color: #e94560;
      color: #fff;
    }

    /* ── Map ─────────────────────────────────────────────────────────────────── */
    #map {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0d0d1a;
    }

    /* ── Layer sidebar ───────────────────────────────────────────────────────── */
    #layer-panel {
      position: fixed;
      top: 44px;
      right: 0;
      width: 210px;
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      background: rgba(11, 17, 35, 0.93);
      border-left: 1px solid #2a2a4a;
      z-index: 900;
    }

    #layer-panel.hidden {
      display: none;
    }

    .layer-panel-title {
      padding: 10px 12px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      border-bottom: 1px solid #1e2a4a;
    }

    .layer-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: #ccc;
      font-size: 13px;
      user-select: none;
    }

    .layer-entry:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .layer-entry input[type="checkbox"] {
      cursor: pointer;
      accent-color: #e94560;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .layer-entry img {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── Place name labels ───────────────────────────────────────────────────── */
    .place-label {
      background: none;
      border: none;
      box-shadow: none;
    }

    .place-label span {
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        1px  1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px  1px 2px #000;
    }

    /* ── Zone / base tooltips ────────────────────────────────────────────────── */
    .leaflet-tooltip.zone-tooltip,
    .leaflet-tooltip.base-tooltip {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
    }

    /* ── Zoom control ────────────────────────────────────────────────────────── */
    .leaflet-control-zoom a {
      background: rgba(22, 33, 62, 0.9);
      border-color: #2a2a4a;
      color: #ccc;
    }

    .leaflet-control-zoom a:hover {
      background: rgba(233, 69, 96, 0.7);
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jed's Sakhal Sandbox - DayZ Server Map</h1>
    <button id="layer-toggle">&#9776; Layers</button>
  </header>

  <div id="layer-panel">
    <div class="layer-panel-title">Layers</div>
    <div id="layer-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/map.js"></script>
</body>
</html>
